AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Shared voting API for vote-page

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 128
    CodeUri: .
    Environment:
      Variables:
        TABLE_NAME: !Ref VotesTable

Resources:
  VotesApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: vote-page-api
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  GetVotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers.getVotes
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref VotesTable
      Events:
        GetVotes:
          Type: Api
          Properties:
            RestApiId: !Ref VotesApi
            Path: /votes
            Method: get

  CastVoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers.castVote
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VotesTable
      Events:
        CastVote:
          Type: Api
          Properties:
            RestApiId: !Ref VotesApi
            Path: /vote
            Method: post

  VotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pollId
          AttributeType: S
        - AttributeName: option
          AttributeType: S
      KeySchema:
        - AttributeName: pollId
          KeyType: HASH
        - AttributeName: option
          KeyType: RANGE

Outputs:
  ApiBaseUrl:
    Description: API base URL for frontend VITE_API_BASE_URL
    Value: !Sub "https://${VotesApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
